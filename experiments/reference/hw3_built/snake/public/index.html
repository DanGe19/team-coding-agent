<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Snake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 class="title">Portal Snake</h1>
    <div class="main-layout">
      <!-- Board area -->
      <div class="board-wrapper">
        <div id="board">
          <canvas></canvas>
          <!-- Overlays -->
          <div id="paused" style="display:none">
            <div class="overlay-card paused-card">
              <p>Paused</p>
            </div>
          </div>
          <div id="game-over" style="display:none">
            <div class="overlay-card game-over-card">
              <h2>Game Over</h2>
              <p class="final-score-line">Score: <span id="final-score">0</span></p>
              <form id="score-form">
                <input type="text" name="name" placeholder="Your name" maxlength="20" autocomplete="off">
                <button type="submit">Save Score</button>
                <p class="form-error"></p>
              </form>
              <button id="restart-over-btn" class="btn btn-secondary">Restart</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Side panel -->
      <div class="side-panel">
        <!-- Stats -->
        <div class="stats-panel">
          <div class="stat-row">
            <span class="stat-label">Score</span>
            <span id="score" class="stat-value">0</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Length</span>
            <span id="length" class="stat-value">4</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Level</span>
            <span id="level" class="stat-value">1</span>
          </div>
        </div>

        <!-- Buttons -->
        <div class="buttons-panel">
          <button id="start-btn" class="btn btn-primary">Start</button>
          <button id="pause-btn" class="btn btn-secondary">Pause</button>
          <button id="restart-btn" class="btn btn-secondary">Restart</button>
        </div>

        <!-- Controls hint -->
        <div class="controls-hint">
          <p><strong>Controls</strong></p>
          <p>Arrow keys / WASD &mdash; move</p>
          <p>Space / P &mdash; pause</p>
          <p>R &mdash; restart</p>
        </div>

        <!-- Leaderboard -->
        <div class="leaderboard-panel">
          <h3>Leaderboard</h3>
          <ol id="leaderboard"></ol>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
  <script src="render.js"></script>
</body>
</html>
